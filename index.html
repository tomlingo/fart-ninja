function layout() {
  const compact = VH < 200, sc = compact ? 3 : 4;                 // big ninja scale
  const colW = Math.min(204, VW - 26 * sc - (compact ? 72 : 32)), cw = Math.floor((colW - 8) / 2);
  const left = Math.max(compact ? 48 : 8, Math.round((VW - (26 * sc + 16 + colW)) / 2)), x0 = left + 26 * sc + 16;
  const titleH = compact ? 20 : 66, blockH = titleH + (compact ? 13 : 22) + 60 + 22;
  const top = Math.max(6, Math.round((VH - 24 - blockH) / 2));
  const ly = top + titleH + (compact ? 5 : 12), cy = ly + (compact ? 8 : 10);
  Object.assign(CARDS.city, { x: x0, y: cy, w: cw });
  Object.assign(CARDS.jungle, { x: x0 + cw + 8, y: cy, w: cw });
  Object.assign(PLAY_BTN, { x: x0, y: cy + 64, w: cw * 2 + 8 });
  Object.assign(LAY, { compact, sc, nx: left, ny: Math.round(top + (cy + 60 - top - 27 * sc) / 2), x0, ty: top, ly, deadY: Math.max(30, Math.round(VH * 0.2)) });
  Object.assign(MENU_BTN, { x: Math.round((VW - 92) / 2), y: LAY.deadY + 84 });
}

function fit() {                                  // fill the screen; snap to whole device pixels so the art stays crisp
  const vv = window.visualViewport, dpr = window.devicePixelRatio || 1;
  let W = vv ? vv.width : innerWidth, H = vv ? vv.height : innerHeight;
  try {
    const cs = getComputedStyle(document.body);   // notch / home-bar safe areas
    W -= parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    H -= parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  } catch (e) {}
  // Shape the view to the screen so the game fills it. Phones get a shorter, zoomed-in view
  // (the camera follows the ninja upward when he jumps high) but never see less than ~340px across.
  const aspect = W / H, phone = Math.min(W, H) < 520;
  let vh = phone ? 160 : 216, vw = Math.round(vh * aspect);
  const minW = phone ? (aspect < 1 ? 300 : 340) : 384;
  if (vw < minW) { vw = minW; vh = Math.max(vh, Math.min(phone ? 300 : 216, Math.round(vw / aspect))); }
  vw = Math.min(480, vw);
  if (vw !== VW || vh !== VH) { VW = vw; VH = vh; cv.width = VW; cv.height = VH; }
  BELOW = phone ? 18 : 32;
  layout();
  let s = Math.min(W / VW, H / VH);
  const snapped = Math.floor(s * dpr) / dpr;
  if (snapped > 0.85 * s) s = snapped;            // otherwise the snap would waste too much screen: scale smoothly
  cv.style.width = VW * s + 'px';
  cv.style.height = VH * s + 'px';
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));

function rng(seed) {           // mulberry32
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function spr(rows) {
  const runs = [];
  let w = 0;
  rows.forEach((row, y) => {
    w = Math.max(w, row.length);
    let x = 0;
    while (x < row.length) {
      const ch = row[x];
      if (!PAL[ch]) { x++; continue; }
      let e = x;
      while (e < row.length && row[e] === ch) e++;
      runs.push([x, y, e - x, PAL[ch]]);
      x = e;
    }
  });
  return { runs, w, h: rows.length };
}
function blitBig(s, x, y, sc, col) {             // scaled-up sprite; col draws it as a flat silhouette
  for (const r of s.runs) {
    ctx.fillStyle = col || r[3];
    ctx.fillRect(x + r[0] * sc, y + r[1] * sc, r[2] * sc, sc);
  }
}
function blit(s, x, y, flipV) {
  x = Math.round(x); y = Math.round(y);
  for (const r of s.runs) {
    ctx.fillStyle = r[3];
    ctx.fillRect(x + r[0], flipV ? y + s.h - 1 - r[1] : y + r[1], r[2], 1);

}

const FONT = {

function text(str, x, y, col, sc = 1) {
  ctx.fillStyle = col;
  let cx = x;
  for (const ch of str) {
    const g = FONT[ch];
    if (g) for (let i = 0; i < 15; i++) {
      if (g[i] === '1') ctx.fillRect(cx + (i % 3) * sc, y + ((i / 3) | 0) * sc, sc, sc);
    }
    cx += 4 * sc;
  }
}

  if (shadow) text(str, x + sc, y + sc, shadow, sc);

/* ------------------------------------------------------------------ audio */
let ac = null, muted = false;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
}
addEventListener('touchend', audioInit);

if (document.addEventListener) document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend(); else ac.resume();
});
const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
function sfxFart(big) {
  if (!ac || muted) return;
  const t = ac.currentTime, d = big ? 0.42 : 0.26, f0 = big ? 72 : 98;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(f0, t);
  for (let i = 1; i <= 12; i++) {
    o.frequency.linearRampToValueAtTime(f0 * (0.7 + Math.random() * 0.55) * (1 - i / 30), t + d * i / 12);
  }
  f.type = 'lowpass'; f.frequency.value = 460;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(f); f.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + d + 0.03);
}
function sfxBark() {
  if (!ac || muted) return;
  const t = ac.currentTime;
  [[0, 520], [0.13, 460]].forEach(([d, f0]) => {
    const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, t + d);

// Endless: the district is generated a stretch at a time, just ahead of the ninja.
const MAX_V = 230, BEAN_PTS = 25;
const BIG_AT = 120 + 500 * 10;                  // the 500 m mark: where the big double-jump enemy first shows up
const speedAt = x => Math.min(MAX_V, 110 + Math.max(0, x) / 115);     // run speed creeps up with distance
const heat = x => Math.min(1, Math.max(0, x) / 16000);                // 0..1 difficulty ramp

function makeWorld(seed) {
  const B = rng(seed ^ 0x5bd1e995);                                   // backdrop gets its own dice
  const far = [], near = [], stars = [];
  let fx = 0;
  while (fx < 512) {
    const w = 14 + ((B() * 22) | 0), h = 26 + ((B() * 60) | 0), win = [];
    for (let i = 0; i < 5; i++) win.push([2 + ((B() * (w - 4)) | 0), 4 + ((B() * (h - 10)) | 0)]);
    far.push({ x: fx, w, h, win });
    fx += w;
  }
  let nx = 0;
  while (nx < 640) {
    const w = 28 + ((B() * 44) | 0), h = 12 + ((B() * 26) | 0);
    near.push({ x: nx, w, h, chim: B() < 0.4, saw: B() < 0.45, palm: B() < 0.5 });
    nx += w + ((B() * 20) | 0);
  }
  for (let i = 0; i < 26; i++) stars.push([(B() * 512) | 0, (B() * 62) | 0, B() < 0.3]);
  return {
    solids: [], enemies: [], gaps: [], beans: [],
    far, farP: fx, near, nearP: nx, stars,
    gen: { R: rng(seed), x: 470, sinceWh: 2, wh: 0, bigs: 0, sinceBig: 0 }
  };
}

function extend(toX) {
  const g = S.gen, R = g.R, solids = S.solids, enemies = S.enemies, gaps = S.gaps, J = S.biome === 'jungle';
  const bean = (cx, cy) => S.beans.push({ x: Math.round(cx) - 4, y: Math.round(cy) - 5 });

  while (g.x < toX) {
    let x = g.x;
    const v = speedAt(x), d = heat(x), r = R(), treat = R() < 0.6;
    let type;
    if (x >= BIG_AT && (g.bigs === 0 || (g.sinceBig >= 6 && R() < 0.16))) type = 'big';
    else if (g.sinceWh >= 4 && R() < 0.3) type = 'wh';
    else if (r < 0.34) type = 'crate';
    else if (r < 0.56) type = 'dog';
    else if (r < 0.78) type = 'robot';
    else type = 'gap';

    if (type === 'crate') {
      const q = R(), rows = q < 0.45 - 0.25 * d ? 1 : q < 0.8 - 0.2 * d ? 2 : 3, cols = R() < 0.3 ? 2 : 1;
      solids.push({ k: 'crate', x, y: GY - rows * 16, w: cols * 16, h: rows * 16, oc: rows > 1 });   // oc: overgrown crate (jungle), else boulder
      if (treat) bean(x + cols * 8, GY - rows * 16 - 18);
      x += cols * 16;
    } else if (type === 'gap') {
      let w = Math.floor(v * (0.36 + R() * (0.42 + 0.1 * d)));        // wider ones need the mid-air boost
      if (R() < d * 0.5) {                                            // later on: a crate guarding the edge
        w = Math.floor(v * 0.3);
        solids.push({ k: 'crate', x, y: GY - 16, w: 16, h: 16 });
        x += 16;
      }
      gaps.push({ x, w, kind: J ? (R() < 0.5 ? 'cliff' : 'fall') : 'pit' });
      if (treat) bean(x + w / 2, GY - 28);
      x += w;
    } else if (type === 'big') {                                      // T-rex (jungle) / old man with a hammer (city)
      x += Math.round(v * 0.45);
      const w = J ? 48 : 30;
      enemies.push({ k: 'big', x, y: GY - 60, w, h: 60 });
      bean(x + w / 2, GY - 84);
      x += w + Math.round(v * 0.3);
      g.bigs++;
      g.sinceBig = 0;
    } else if (type === 'dog') {
      x += 70;                                                        // room for its charge
      enemies.push({ k: 'dog', x, y: GY - 11, w: J ? 22 : 18, h: 11, run: false });   // a tiger in the jungle
      x += J ? 22 : 18;
    } else if (type === 'robot') {
      x += 24;
      const arms = R() < 0.35 + 0.4 * d;
      if (J && arms) x += Math.round(v * 0.55);                         // leave room for its outstretched arms
      enemies.push({ k: 'robot', x, y: GY - 20, w: 14, h: 20, home: x, range: 18, dir: -1, arms, up: 0 });
      if (treat) { if (J && arms) bean(x - 30, GY - 46); else bean(x + 7, GY - 20 - (arms ? ARM_REACH + 14 : 18)); }
      x += 14 + 24;
    } else {
      const w = 200 + ((R() * 9) | 0) * 16 + Math.floor((v - 110) / 16) * 16, h = 70;
      if (R() < 0.5) {                                                // optional crate "step" at the wall
        solids.push({ k: 'crate', x, y: GY - 32, w: 32, h: 32, oc: true });
        x += 32;
      }
      solids.push({ k: 'wh', x, y: GY - h, w, h, id: g.wh, n: 1 + ((R() * 9) | 0) });
      const q = R();
      if (w >= 264 && q < 0.45) {
        const rx = Math.floor(x + w * 0.62);
        enemies.push({ k: 'robot', x: rx, y: GY - h - 20, w: 14, h: 20, home: rx, range: 16, dir: -1, arms: R() < 0.3 + 0.3 * d && !J, up: 0 });
      } else if (q > 0.6) {
        solids.push({ k: 'crate', x: Math.floor(x + w * 0.6), y: GY - h - 16, w: 16, h: 16, oc: true });
      }
      for (let i = 0; i < 3; i++) bean(x + w * 0.18 + i * 22, GY - h - 9);   // a reward for making the roof
      x += w + v * 0.5;
      g.wh++;
      g.sinceWh = 0;
    }
    if (type !== 'wh') g.sinceWh++;
    if (type !== 'big') g.sinceBig++;

    const space = v * (1.05 - 0.13 * d + R() * (0.8 - 0.35 * d));     // breathing room shrinks as it heats up
    const q = R();
    if (space > v * 1.35 && type !== 'dog') {
      if (q < 0.3) for (let i = 0; i < 3; i++) bean(x + space / 2 - 6 + (i - 1) * 18, GY - (i === 1 ? 42 : 30));   // a tempting arc
      else if (q < 0.42) bean(x + space / 2 - 6, GY - 84);            // sky-high: boost only
    }
    g.x = x + space;
  }
}

/* ------------------------------------------------------------------ state */
let S = null;
let best = 0;
try { best = +localStorage.getItem('fartNinjaBestScore') || 0; } catch (e) {}

const distM = () => Math.max(0, Math.floor((S.p.x - 120) / 10));
const scoreNow = () => distM() + S.beanCount * BEAN_PTS;

let sel = 'city';                               // level chosen on the splash screen
try { if (localStorage.getItem('fartNinjaLevel') === 'jungle') sel = 'jungle'; } catch (e) {}
const SND_BTN = { x: 5, y: 23, w: 15, h: 11 };   // sound on/off, top-left (out of the way of thumbs)
const FS_BTN = { x: 30, y: 23, w: 13, h: 11 };   // fullscreen toggle, next to it
const fsRoot = document.documentElement;
const canFS = !!(fsRoot && (fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen));   // not offered on iPhone
const isFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFS() {
  if (!canFS) return;
  try {
    if (isFS()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else {
      const r = (fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen).call(fsRoot);
      const lock = () => { try { const l = screen.orientation.lock('landscape'); if (l && l.catch) l.catch(() => {}); } catch (e) {} };
      if (r && r.then) r.then(lock, () => {}); else lock();      // on phones, also turn the game sideways
    }
  } catch (e) {}
}
if (document.addEventListener) {
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 60));
  document.addEventListener('webkitfullscreenchange', () => setTimeout(fit, 60));
}
let fsArmed = false;
const grow = (b, m) => ({ x: b.x - m, y: b.y - m, w: b.w + m * 2, h: b.h + m * 2 });

function newLevel(seed, biome) {
  if (seed === undefined) seed = (Math.random() * 0x10000) | 0;
  S = Object.assign(makeWorld(seed), {
    seed,
    biome: biome || sel,                        // which of the two levels this run is
    code: seed.toString(16).toUpperCase().padStart(4, '0'),
    mode: 'splash',
    sp: [], spT: 0,                             // splash-screen fart clouds
    t: 0, time: 0, lock: 0, shake: 0, why: '',
    beanCount: 0, mile: 0, banner: { s: '', t: 0 }, newBest: false, tidy: 0,
    parts: [], pops: [],
    p: { x: 120, y: GY - 16, w: 12, h: 16, vy: 0, air: 0, gas: 2, buf: 0, trail: 0, run: 0, pit: null }
  });
  extend(1600);
}

function puff(x, y, n, big, baseVx) {
  for (let i = 0; i < n; i++) {
    S.parts.push({
      x: x + rand(-2, 2), y: y + rand(-2, 2),
      vx: baseVx * 0.35 - rand(10, 70), vy: rand(10, big ? 95 : 70),
      life: 0, max: rand(0.45, 0.9) * (big ? 1.3 : 1), s: rand(2, 4) + (big ? 1.5 : 0), g: 1
    });
  }
  if (S.parts.length > 260) S.parts.splice(0, S.parts.length - 260);
}
function dust(x, y) {
  for (let i = 0; i < 5; i++) {
    S.parts.push({ x: x + rand(0, 10), y: y - 1, vx: rand(-40, 30), vy: rand(-25, -5), life: 0, max: rand(0.2, 0.4), s: 1.5, g: 0 });
  }
}

/* ------------------------------------------------------------------ input */
function setSel(b) {
  if (sel === b) return;
  sel = b; S.biome = b;
  try { localStorage.setItem('fartNinjaLevel', b); } catch (e) {}
  sfxTone([660], 0.04, 'square', 0.05);
}
function startRun() { newLevel(undefined, sel); S.mode = 'play'; }
function toSplash() { sel = S.biome; newLevel(undefined, sel); }
function press() {
  audioInit();
  if (S.mode === 'splash') startRun();
  else if (S.mode === 'play') { S.p.buf = 0.12; }
  else if (S.lock <= 0) startRun();
}
function release() {
  if (S.mode === 'play' && S.p.vy < -110) S.p.vy = -110;   // short tap = short hop
}
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'KeyX', 'Enter'];
const PICK_KEYS = ['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'];
addEventListener('keydown', e => {
  if (S.mode === 'splash' && PICK_KEYS.includes(e.code)) {
    e.preventDefault(); audioInit();
    setSel(e.code === 'ArrowLeft' || e.code === 'KeyA' ? 'city' : 'jungle');
  }
  else if (JUMP_KEYS.includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
  else if (e.code === 'KeyM') muted = !muted;
  else if (e.code === 'KeyF') toggleFS();
  else if ((e.code === 'Escape' || e.code === 'Backspace') && S.mode !== 'splash') { e.preventDefault(); toSplash(); }
});
addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) release(); });
const inBox = (pt, b) => pt.x >= b.x && pt.x < b.x + b.w && pt.y >= b.y && pt.y < b.y + b.h;
function canvasPoint(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH };
}
addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType === 'touch') touch = true;
  const pt = canvasPoint(e);
  if (inBox(pt, grow(SND_BTN, 7))) { audioInit(); muted = !muted; return; }
  if (canFS && inBox(pt, grow(FS_BTN, 6))) { fsArmed = true; return; }   // acts on release: browsers only allow fullscreen then
  if (S.mode === 'splash') {                    // tap a level card to play it; anywhere else just wakes the audio
    audioInit();
    for (const b in CARDS) if (inBox(pt, CARDS[b])) {
      if (touch && sel !== b) setSel(b);        // touch: first tap highlights and previews, a second tap plays
      else { setSel(b); startRun(); }
    }
    if (touch && inBox(pt, grow(PLAY_BTN, 4))) startRun();
  }
  else if (S.mode === 'dead' && inBox(pt, grow(MENU_BTN, 8))) toSplash();
  else press();
});
addEventListener('pointermove', e => {
  if (S.mode !== 'splash') return;
  const pt = canvasPoint(e);
  for (const b in CARDS) if (inBox(pt, CARDS[b])) setSel(b);
});
addEventListener('pointerup', e => {
  if (fsArmed) { fsArmed = false; if (inBox(canvasPoint(e), grow(FS_BTN, 6))) toggleFS(); return; }
  release();
});
addEventListener('pointercancel', () => { fsArmed = false; release(); });

/* ----------------------------------------------------------------- update */
const overlap = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

function die(why, noBounce) {
  const p = S.p;
  S.mode = 'dead'; S.why = why; S.lock = 0.45; S.shake = 0.3;
  buzz(70);
  if (!noBounce) p.vy = -230;
  const sc = scoreNow();
  if (sc > best) { best = sc; S.newBest = true; try { localStorage.setItem('fartNinjaBestScore', best); } catch (e) {} }
  puff(p.x + 4, p.y + 10, 8, false, 0);
  sfxTone([180, 120, 70], 0.09, 'sawtooth', 0.15);
}

function gapAt(x0, x1) {                    // the gap that fully contains [x0, x1], if any
  for (const g of S.gaps) {
    if (g.x > x1) break;
    if (x0 >= g.x && x1 <= g.x + g.w) return g;
  }
  return null;
}

function update(dt) {
  const p = S.p;
  S.t += dt;
  if (S.lock > 0) S.lock -= dt;
  if (S.shake > 0) S.shake -= dt;

  for (const q of S.parts) {
    q.life += dt; q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= 1 - 2.2 * dt;
    q.vy += (q.g ? -70 : 120) * dt;
    if (q.g && q.y > GY - 3 && q.y < GY + 4 && !gapAt(q.x, q.x)) { q.y = GY - 3; q.vy = -Math.abs(q.vy) * 0.3; }   // gas billows along the ground
  }
  S.parts = S.parts.filter(q => q.life < q.max);
  for (const o of S.pops) o.t += dt;
  if (S.pops.length && S.pops[0].t > 0.7) S.pops.shift();

  if (S.mode === 'splash') {
    if ((S.spT -= dt) <= 0) {
      S.spT = 0.06;
      S.sp.push({ x: LAY.nx + 13 * LAY.sc + rand(-8, 8), y: LAY.ny + 23.5 * LAY.sc + Math.sin(S.t * 2.2) * 4, vx: rand(-16, 16), vy: rand(16, 44), r: 3, life: 0, max: rand(1.6, 2.4) });
    }
    for (const q of S.sp) { q.life += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy *= 1 - 0.9 * dt; q.vx += rand(-20, 20) * dt; q.r += 7 * dt; }
    S.sp = S.sp.filter(q => q.life < q.max);
    return;
  }
  if (S.mode === 'dead') { p.vy += GRAV * dt; p.y += p.vy * dt; return; }
  /* ---- play ---- */
  S.time += dt;
  const v = speedAt(p.x), J = S.biome === 'jungle';
  if (S.gen.x < p.x + 900) extend(p.x + 1500);
  if ((S.tidy -= dt) < 0) {                   // forget what is far behind
    S.tidy = 1;
    const cut = p.x - 240;
    S.solids = S.solids.filter(s => s.x + s.w > cut);
    S.enemies = S.enemies.filter(e => e.x > cut);
    S.gaps = S.gaps.filter(g => g.x + g.w > cut);
    S.beans = S.beans.filter(b => b.x > cut && !b.got);
  }
  if (S.banner.t > 0) S.banner.t -= dt;
  const mile = Math.floor(distM() / 500);
  if (mile > S.mile) { S.mile = mile; S.banner = { s: mile * 500 + 'M', t: 1.8 }; sfxTone([659, 784, 988], 0.07); }

  if (p.buf > 0) {
    p.buf -= dt;
    if (p.air < 0.08) {                       // ground jump
      p.vy = JUMP_V; p.gas = 1; p.air = 1; p.buf = 0; p.trail = 0.16;
      puff(p.x + 2, p.y + 13, 10, false, v); sfxFart(false);
    } else if (p.gas > 0) {                   // mid-air boost
      p.vy = BOOST_V; p.gas = 0; p.buf = 0; p.trail = 0.2;
      puff(p.x + 2, p.y + 13, 15, true, v); sfxFart(true);
    }
  }
  if (p.trail > 0) {
    p.trail -= dt;
    if (Math.random() < dt * 45) puff(p.x + 2, p.y + 14, 1, false, v);
  }

  if (p.pit) {                                // already below street level: no way back
    p.vy += GRAV * dt; p.y += p.vy * dt;
    p.x = Math.min(p.x + v * dt, p.pit.x + p.pit.w - 9);
    if (p.y > GY + 24) die(p.pit.kind === 'fall' ? 'WASHED DOWN A WATERFALL' : p.pit.kind === 'cliff' ? 'FELL OFF A CLIFF' : 'FELL DOWN A DROP-OFF', true);
    return;
  }
  const prevBottom = p.y + p.h;
  p.vy += GRAV * dt;
  p.x += v * dt;
  p.y += p.vy * dt;
  p.run += dt * v / 11;

  let grounded = false;
  const hx = p.x + 3, hw = 6;
  for (const s of S.solids) {
    if (s.x > p.x + 40) break;
    if (s.x + s.w < p.x - 8) continue;
    if (!overlap(hx, p.y + 1, hw, p.h - 1, s.x, s.y, s.w, s.h)) continue;
    if (p.vy >= 0 && prevBottom <= s.y + 5) { p.y = s.y - p.h; grounded = true; }
    else { die(s.k === 'wh' ? (J ? 'SPLAT! HUT WALL' : 'SPLAT! WAREHOUSE WALL') : J && !s.oc && s.h === 16 ? 'RAN INTO A BOULDER' : 'CRATED!'); return; }
  }
  if (p.y + p.h >= GY) {
    const gap = gapAt(hx, hx + hw);
    if (!gap) { p.y = GY - p.h; grounded = true; }
    else if (p.y + p.h > GY + 5) { p.pit = gap; return; }
  }
  if (grounded) {
    if (p.air > 0.12) dust(p.x, p.y + p.h);
    p.vy = 0; p.air = 0; p.gas = 2;
  } else {
    p.air += dt;
    if (p.gas === 2 && p.air >= 0.08) p.gas = 1;   // walked off a ledge: one boost left
  }

  for (const e of S.enemies) {
    if (e.x > p.x + 384) break;
    if (e.x < p.x - 120) continue;
    if (e.k === 'dog') {
      if (!e.run && e.x - p.x < 230) e.run = true;
      if (e.fall) { e.vy = (e.vy || 0) + GRAV * dt; e.y += e.vy * dt; continue; }
      if (e.run && !(e.swipe > 0)) { e.x -= 85 * dt; if (gapAt(e.x + 4, e.x + 14)) e.fall = true; }   // it stops to rear up
      // ninja in the air and about to pass overhead: rear up on the hind legs, bark and swipe at him
      if (!e.swiped && p.y + p.h < e.y && p.x + 12 > e.x - 40 && p.x < e.x + e.w) { e.swiped = true; e.swipe = J ? 0.7 : 0.6; if (J) sfxGrowl(); else sfxBark(); }
      if (e.swipe > 0) e.swipe -= dt;
    } else if (e.k === 'big') {                 // too tall for one jump; bellows when it spots the ninja
      if (!e.seen && e.x - p.x < 300) {
        e.seen = true; e.yell = 1.1;
        if (J) { sfxRoar(); S.shake = 0.4; } else sfxYell();
      }
      if (e.yell > 0) e.yell -= dt; else if (e.seen) e.x -= 16 * dt;
    } else {
      if (!J || ((S.t * 2 + e.home) | 0) % 3) e.x += e.dir * 22 * dt;     // jungle robots seize up now and then
      if (e.x < e.home - e.range) e.dir = 1;
      if (e.x > e.home + e.range) e.dir = -1;
      if (J && Math.random() < dt * 1.6 && e.x - p.x < 384) S.parts.push({ x: e.x + 8, y: e.y + 2, vx: rand(-10, 10) + 30, vy: -14, life: 0, max: rand(0.5, 0.9), s: 2, g: 1, c: '#555a54' });   // smoke
      if (e.arms && J) {                        // rusty arms stretch out along the ground toward the ninja
        if (!e.reach) e.reach = Math.round(speedAt(e.x) * 0.55);          // too long for a single jump
        const near = e.x - p.x < e.reach + v * 1.3 && e.x - p.x > -30;
        e.up = Math.max(0, Math.min(1, e.up + (near ? dt : -dt) / 0.35));
        if (near && !e.warned) { e.warned = true; sfxTone([150, 110, 85], 0.07, 'sawtooth', 0.07); }
        const len = e.reach * e.up;
        if (len > 1 && overlap(hx, p.y + 2, hw, p.h - 3, e.x - len, e.y + 8, len + 2, 5)) { die('GRABBED BY A MOSSY ROBOT'); return; }
      } else if (e.arms) {                      // telescoping arms go up as the ninja approaches
        const near = e.x - p.x < Math.max(170, v * 1.2) && e.x - p.x > -30;
        e.up = Math.max(0, Math.min(1, e.up + (near ? dt : -dt) / 0.3));
        if (near && !e.warned) { e.warned = true; sfxTone([220, 330, 440], 0.05, 'square', 0.06); }
      }
    }
    const top = e.y - (J ? 0 : (e.up || 0) * ARM_REACH) - (e.swipe > 0 ? 9 : 0);   // raised arms / a swiping paw reach higher
    if (overlap(hx, p.y + 2, hw, p.h - 3, e.x + 2, top + 2, e.w - 4, e.y + e.h - top - 2)) {
      die(e.k === 'dog' ? (J ? 'MAULED BY A TIGER' : 'BITTEN BY A GUARD DOG') : e.k === 'big' ? (J ? 'CHOMPED BY A T-REX' : 'HAMMERED BY AN OLD MAN') : J ? 'GRABBED BY A MOSSY ROBOT' : 'ZAPPED BY A ROBOT');
      return;
    }
  }

  // cans of beans: points, and each one tops the tank back up by one fart
  for (const b of S.beans) {
    if (b.got || !overlap(p.x - 1, p.y - 1, p.w + 2, p.h + 2, b.x, b.y, 8, 9)) continue;
    b.got = true;
    S.beanCount++;
    p.gas = Math.min(2, p.gas + 1);
    S.pops.push({ x: b.x - 4, y: b.y - 4, t: 0, s: '+' + BEAN_PTS });
    for (let i = 0; i < 6; i++) S.parts.push({ x: b.x + 4, y: b.y + 4, vx: rand(-60, 60) + v, vy: rand(-90, -10), life: 0, max: rand(0.2, 0.45), s: 1.5, g: 0, c: '#ffd76a' });
    sfxTone([988, 1319], 0.05, 'square', 0.07);
  }
}

/* ------------------------------------------------------------------- draw */
const SKY = ['#1c1838', '#261e4a', '#35265c', '#4b2f6c', '#693a78', '#8e467d', '#b5557c', '#d76b74', '#ee8b6c', '#f8b072'];
const GREENS = ['#dcff72', '#a9ea4c', '#72c238', '#4a942c'];

function blob(x, y, size, col) {
  const sz = Math.max(1, Math.round(size)), x0 = Math.round(x - sz / 2), y0 = Math.round(y - sz / 2);
  ctx.fillStyle = col;
  if (sz < 3) ctx.fillRect(x0, y0, sz, sz);
  else { ctx.fillRect(x0 + 1, y0, sz - 2, sz); ctx.fillRect(x0, y0 + 1, sz, sz - 2); }
}

function drawCrate(x, y) {

function drawWarehouse(s, x) {

/* ---- jungle level art ---- */
const JSKY = ['#1f5d6b', '#27707a', '#318487', '#439a90', '#5cae96', '#7fc29b', '#a3d3a2', '#c5e0aa', '#e0eab4', '#f3efc0'];

const FRONDS = [[-1, 0.95, 21, 0.3], [1, 0.95, 21, 0.3], [-1, 0.4, 18, 0.45], [1, 0.4, 18, 0.45], [-1, 1.7, 13, 0], [1, 1.7, 13, 0], [-1, 0.25, 10, 0.9], [1, 0.25, 10, 0.9]];
function drawPalm(cx, h, lean, sc, tc, fc, hc) {          // curved trunk, drooping fronds, coconuts
  for (let j = 0; j < h; j += 2) {
    const u = j / h, x = Math.round(cx + lean * u * u);
    rect(x, GY - j - 2, u > 0.55 ? 2 : 3, 2, tc);
    if (j % 6 === 0) rect(x, GY - j - 2, u > 0.55 ? 2 : 3, 1, hc);
  }
  const tx = Math.round(cx + lean), ty = GY - h;
  for (const f of FRONDS) {
    const len = Math.round(f[2] * sc);
    for (let i = 0; i < len; i++) {
      const y = Math.round(ty - 2 + f[1] * i * i / len - f[3] * i), x = tx + f[0] * i + (f[0] > 0 ? 1 : 0);
      rect(x, y, 1, 3, fc);
      if (i % 3 === 1) rect(x, y + 3, 1, 2, fc);
      if (f[1] < 1) rect(x, y, 1, 1, hc);
    }
  }
  rect(tx - 2, ty - 3, 6, 4, fc);
  rect(tx - 1, ty + 1, 2, 2, tc); rect(tx + 2, ty + 2, 2, 2, tc);
}

function drawJungleBack(bgScroll, gs) {
  const bh = Math.ceil(GY / JSKY.length);
  JSKY.forEach((c, i) => rect(0, i * bh, VW, bh, c));
  const sx = VW - 40, sy = 64, sr = 14;                       // hazy sun
  for (let dy = -sr; dy <= sr; dy++) {
    const hw = Math.floor(Math.sqrt(sr * sr - dy * dy));
    rect(sx - hw, sy + dy, hw * 2, 1, '#fff8d2');
  }
  // far: misty canopy
  let off = (bgScroll * 0.12) % S.farP;
  for (const b of S.far) {
    let x = Math.floor(b.x - off);
    if (x + b.w < 0) x += S.farP;
    if (x >= VW) continue;
    const h = 34 + ((b.h * 0.6) | 0);
    rect(x, GY - h + 4, b.w, h - 4, '#6fb88f');
    rect(x + 2, GY - h + 2, b.w - 4, 2, '#6fb88f');
    rect(x + 4, GY - h, b.w - 8, 2, '#6fb88f');
    for (const wn of b.win) rect(x + wn[0], GY - h + 5 + ((wn[1] * 0.4) | 0), 2, 1, '#8fd0a4');
  }
  // middle distance: a scattering of smaller palms
  off = (bgScroll * 0.24) % S.nearP;
  for (let n = 0; n < S.near.length; n += 2) {
    const b = S.near[n];
    let x = Math.floor(b.x + 17 - off);
    if (x < -30) x += S.nearP;
    if (x >= VW + 30) continue;
    drawPalm(x, 50 + b.h, b.saw ? 7 : -6, 0.75, '#4f9a7b', '#4f9a7b', '#63ad8d');
  }
  // near: trees with hanging vines, and tall palms
  off = (bgScroll * 0.4) % S.nearP;
  for (const b of S.near) {
    let x = Math.floor(b.x - off);
    if (x + b.w < 0) x += S.nearP;
    if (x >= VW) continue;
    if (b.palm) { drawPalm(x + (b.w >> 1), 62 + b.h * 2, (b.saw ? 1 : -1) * (7 + b.h % 7), 1, '#2b5a44', '#2f7a55', '#4a9c6c'); continue; }
    const th = 44 + b.h * 2, cx = x + (b.w >> 1), y = GY - th;
    rect(cx - 3, y + 12, 6, th - 12, '#2b5a44');
    rect(cx - 5, GY - 5, 10, 5, '#2b5a44');
    rect(x + 3, y, b.w - 6, 24, '#2f7a55'); rect(x, y + 4, b.w, 15, '#2f7a55');
    if (b.saw) rect(x + ((b.w * 0.2) | 0), y - 8, (b.w * 0.6) | 0, 10, '#2f7a55');
    rect(x + 6, y + (b.saw ? -8 : 0), b.w - 16, 1, '#4a9c6c');
    rect(x + 4, y + 9, 5, 1, '#4a9c6c'); rect(x + b.w - 14, y + 13, 6, 1, '#4a9c6c');
    if (b.chim) {
      rect(x + 5, y + 19, 1, 26, '#2f7a55');
      for (let j = 4; j < 26; j += 6) rect(x + 4 + (j % 12 ? 2 : 0), y + 19 + j, 1, 1, '#4a9c6c');
    }
  }
  // ground: earth with a grassy top
  rect(0, GY, VW, WB - GY, '#3b2a1e');
  rect(0, GY, VW, 2, '#6cc24a');
  rect(0, GY + 2, VW, 2, '#3f8a3a');
  for (let wx = Math.floor(gs / 32) * 32; wx < gs + VW; wx += 32) {
    const x = Math.floor(wx - gs), k = (wx / 32) & 3;
    rect(x + 5, GY - 2, 1, 2, '#6cc24a'); rect(x + 7, GY - 3, 1, 3, '#8fe060'); rect(x + 9, GY - 1, 1, 1, '#6cc24a');
    rect(x + 20, GY + 8 + k * 5, 3, 2, '#5a4433');
    rect(x + 2 + k * 3, GY + 17, 9, 1, '#2c1f15');
  }
}

function bigBlob(cx, cy, r, col) {                // chunky pixel circle

    const hw = Math.floor(Math.sqrt(Math.max(0, r * r - (dy + 1) * (dy + 1))) / 2) * 2;
    if (hw > 0) ctx.fillRect(cx - hw, cy + Math.floor(dy), hw * 2, 2);
  }
}

function drawCard(b, selected) {
  const c = CARDS[b], jungle = b === 'jungle', x = c.x, y = c.y;
  rect(x, y, c.w, c.h, selected ? '#dcff72' : '#14132b');
  rect(x + 2, y + 2, c.w - 4, c.h - 4, '#14132b');
  const px = x + 3, py = y + 3, pw = c.w - 6, bands = jungle ? JSKY : SKY, gy = py + 32;
  for (let i = 0; i < 4; i++) rect(px, py + i * 8, pw, 8, bands[1 + i * 2 + (i === 3 ? 2 : 0)]);
  if (jungle) {
    for (const t of [[6, 24], [26, 17], [50, 27], [74, 20]]) {
      if (t[0] + 13 > pw) continue;
      rect(px + t[0] + 5, gy - t[1] + 6, 3, t[1] - 6, '#2b5a44');
      rect(px + t[0], gy - t[1], 13, 8, '#2f7a55'); rect(px + t[0] + 2, gy - t[1] - 2, 9, 3, '#2f7a55');
    }
    rect(px, gy, pw, 8, '#3b2a1e'); rect(px, gy, pw, 2, '#6cc24a');
    blit(TIGER[0], px + 14, gy - 11); blit(MOSSBOT[0], px + 60, gy - 20);
  } else {
    for (const t of [[0, 14, 16], [18, 22, 12], [34, 10, 20], [58, 18, 14], [76, 12, 16]]) if (t[0] < pw) rect(px + t[0], gy - t[1], Math.min(t[2], pw - t[0]), t[1], '#4d3168');
    rect(px, gy, pw, 8, '#29233f'); rect(px, gy, pw, 1, '#7669a0');
    blit(DOG[0], px + 14, gy - 11); blit(BOT[0], px + 60, gy - 20);
  }
  const label = jungle ? 'JUNGLE' : 'WAREHOUSE DISTRICT';
  text(label, x + Math.round((c.w - textW(label)) / 2), y + 47, selected ? '#dcff72' : '#a99ad6');
  if (!selected) { ctx.globalAlpha = 0.45; rect(x, y, c.w, c.h, '#0d0b1a'); ctx.globalAlpha = 1; }
  else if (((S.t * 3) | 0) % 2) { rect(x + 5, y + 48, 3, 3, '#dcff72'); rect(x + c.w - 8, y + 48, 3, 3, '#dcff72'); }
}

function drawSplash() {
  ctx.globalAlpha = 0.5; rect(0, 0, VW, VH, '#0d0b1a'); ctx.globalAlpha = 1;
  // green cloud billowing out below the ninja
  for (const q of S.sp) {
    const a = q.life / q.max;
    ctx.globalAlpha = a > 0.5 ? Math.max(0, 1 - (a - 0.5) / 0.5) : 1;
    bigBlob(q.x, q.y, q.r, GREENS[Math.min(3, (a * 4) | 0)]);
  }
  ctx.globalAlpha = 1;
  // the ninja, hanging in the air and staring straight out
  const L = LAY, sc = L.sc, bob = Math.round(Math.sin(S.t * 2.2) * sc), nx = L.nx, ny = L.ny + bob;
  const fr = ((S.t * 0.8) % 3) > 2.85 ? 2 : ((S.t * 6) | 0) % 2;
  for (const o of [[-2, 0], [2, 0], [0, -2], [0, 2]]) blitBig(BIG[fr], nx + o[0], ny + o[1], sc, '#f4f0dc');
  blitBig(BIG[fr], nx, ny, sc);
  // title
  if (L.compact) { text('FART NINJA', L.x0 + 2, L.ty + 2, '#14132b', 4); text('FART NINJA', L.x0, L.ty, '#dcff72', 4); }
  else {
    text('FART', L.x0 + 3, L.ty + 3, '#14132b', 6); text('FART', L.x0, L.ty, '#dcff72', 6);
    text('NINJA', L.x0 + 3, L.ty + 39, '#14132b', 6); text('NINJA', L.x0, L.ty + 36, '#dcff72', 6);
  }
  text('BEST ' + best, 5, 8, '#e6dcff');
  text('SELECT YOUR LEVEL', L.x0, L.ly, '#ffffff');
  drawCard('city', sel === 'city');
  drawCard('jungle', sel === 'jungle');
  if (touch) {
    const b = PLAY_BTN, label = sel === 'jungle' ? 'PLAY JUNGLE' : 'PLAY WAREHOUSE DISTRICT';
    rect(b.x, b.y, b.w, b.h, '#14132b');
    rect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, ((S.t * 2) | 0) % 2 ? '#dcff72' : '#a9ea4c');
    text(label, b.x + Math.round((b.w - textW(label, 2)) / 2), b.y + 4, '#14132b', 2);
  }
  else {
    if (((S.t * 2) | 0) % 2) text('LEFT OR RIGHT TO CHOOSE - SPACE TO START', L.x0, PLAY_BTN.y + 2, '#ffd76a');
    text('OR CLICK A LEVEL', L.x0, PLAY_BTN.y + 11, '#e6dcff');
  }
  textC(touch ? 'TAP A LEVEL TO PREVIEW IT. IN GAME: TAP TO JUMP, HOLD FOR HIGHER.' : 'HOLD TO JUMP HIGHER - PRESS AGAIN IN THE AIR FOR A BOOST', VH - 21, '#e6dcff');
  textC(touch ? 'TAP AGAIN IN THE AIR TO BOOST. GRAB BEANS FOR POINTS AND GAS.' : 'GRAB CANS OF BEANS FOR POINTS AND EXTRA GAS. M TO MUTE.', VH - 11, '#e6dcff');
  drawSound(); drawFS();
}

let camY = 0;                                     // top of the view in world pixels
function draw() {
  const p = S.p;
  let cam = Math.floor(p.x - PX);
  if (S.shake > 0) cam += Math.round(rand(-2, 2));
  const bgScroll = S.mode === 'splash' ? cam + S.t * 40 : cam;

  const J = S.biome === 'jungle';
  const baseCam = GY + BELOW - VH;                 // normally the view rests on the ground...
  const wantY = S.mode === 'play' && !p.pit ? Math.min(baseCam, p.y - 50) : S.mode === 'dead' ? camY : baseCam;   // ...and rises with a high jump
  camY = S.mode === 'splash' || Math.abs(wantY - camY) > 160 ? wantY : camY + (wantY - camY) * 0.18;
  const cy = Math.round(camY);
  ctx.save();
  ctx.translate(0, -cy);
  if (cy < 0) rect(0, cy, VW, -cy, J ? JSKY[0] : SKY[0]);
  if (J) drawJungleBack(bgScroll, S.mode === 'splash' ? bgScroll : cam);
  else {
  // sky
  const bh = Math.ceil(GY / SKY.length);
  SKY.forEach((c, i) => rect(0, i * bh, VW, bh, c));
  for (const st of S.stars) rect(st[0], st[1], 1, 1, st[2] && ((S.t * 2 + st[0]) | 0) % 2 ? '#8f7fc4' : '#e6dcff');
  // sun
  const sx = VW - 98, sy = 150, sr = 27;
  for (let dy = -sr; dy <= sr; dy++) {
    if (dy > 2 && (dy % 5 === 0 || (dy > 14 && dy % 5 === 1))) continue;
    const hw = Math.floor(Math.sqrt(sr * sr - dy * dy));
    rect(sx - hw, sy + dy, hw * 2, 1, dy < -8 ? '#fff0a8' : dy < 8 ? '#ffd978' : '#ffb765');
  }
  // far skyline
  let off = (bgScroll * 0.12) % S.farP;
  for (const b of S.far) {
    let x = Math.floor(b.x - off);
    if (x + b.w < 0) x += S.farP;
    if (x >= VW) continue;
    rect(x, GY - b.h, b.w, b.h, '#7c4580');
    for (const wn of b.win) rect(x + wn[0], GY - b.h + wn[1], 1, 2, '#ffc27a');
  }
  // near skyline (factories)
  off = (bgScroll * 0.4) % S.nearP;
  for (const b of S.near) {
    let x = Math.floor(b.x - off);
    if (x + b.w < 0) x += S.nearP;
    if (x >= VW) continue;
    rect(x, GY - b.h, b.w, b.h, '#4d3168');
    if (b.saw) for (let i = 0; i + 10 <= b.w; i += 10) for (let j = 0; j < 5; j++) rect(x + i, GY - b.h - 5 + j, (j + 1) * 2, 1, '#4d3168');
    if (b.chim) { rect(x + b.w - 9, GY - b.h - 22, 5, 22, '#4d3168'); rect(x + b.w - 10, GY - b.h - 23, 7, 2, '#5f3d7c'); }
    rect(x, GY - b.h, b.w, 1, '#5f3d7c');
  }

  // ground
  rect(0, GY, VW, WB - GY, '#29233f');
  rect(0, GY, VW, 1, '#7669a0');
  rect(0, GY + 1, VW, 2, '#3b3357');
  const gs = S.mode === 'splash' ? bgScroll : cam;
  for (let wx = Math.floor(gs / 32) * 32; wx < gs + VW; wx += 32) {
    rect(Math.floor(wx - gs), GY + 15, 14, 2, '#453c66');
    rect(Math.floor(wx - gs) + 21, GY + 6 + ((wx / 32) & 3) * 5, 3, 1, '#352e50');
  }
  }

  if (S.mode === 'splash') { ctx.restore(); drawSplash(); return; }

  // drop-offs
  for (const g of S.gaps) {
    const x = g.x - cam;
    if (x > VW) break;
    if (x + g.w < 0) continue;
    if (J) { drawJungleGap(g, x); continue; }
    rect(x, GY, g.w, WB - GY, '#0b0916');
    rect(x, GY, g.w, 5, '#1b1631'); rect(x, GY + 5, g.w, 5, '#130f24');
    rect(x, GY, 2, WB - GY, '#3b3357'); rect(x + g.w - 2, GY, 2, WB - GY, '#221c38');
    for (let i = 0; i < 8; i += 2) {             // hazard-striped lips
      rect(x - 8 + i, GY, 2, 3, i % 4 ? '#2a2a33' : '#e8b93a');
      rect(x + g.w + i, GY, 2, 3, i % 4 ? '#2a2a33' : '#e8b93a');
    }
  }

  // world
  for (const s of S.solids) {
    if (s.x - cam > VW + 8) break;
    if (s.x + s.w - cam < -8) continue;
    if (s.k === 'wh') { if (J) drawHut(s, s.x - cam); else drawWarehouse(s, s.x - cam); }
  }
  for (const s of S.solids) {
    if (s.x - cam > VW + 8) break;
    if (s.x + s.w - cam < -8 || s.k !== 'crate') continue;
    if (J && !s.oc) { drawBoulder(Math.floor(s.x - cam), s.y, s.w, s.h); continue; }
    for (let cx = 0; cx < s.w; cx += 16) for (let cy = 0; cy < s.h; cy += 16) {
      if (J) drawOvergrownCrate(Math.floor(s.x - cam) + cx, s.y + cy, cy === 0); else drawCrate(s.x - cam + cx, s.y + cy);
    }
  }
  for (const b of S.beans) {
    const x = b.x - cam;
    if (b.got || x < -10 || x > VW) continue;
    const bob = Math.round(Math.sin(S.t * 5 + b.x * 0.05) * 1.5);
    blit(CAN, x, b.y + bob);
    if (((S.t * 3 + b.x) | 0) % 4 === 0) rect(Math.round(x) + 6, b.y + bob - 1, 1, 1, '#ffffff');
  }
  for (const e of S.enemies) {
    const x = e.x - cam;
    if (x > VW + 8) break;
    if (x < -60) continue;
    if (e.k === 'big') { if (J) drawRex(e, x); else drawOldMan(e, x); continue; }
    const fr = ((S.t * (e.k === 'dog' ? 10 : 5)) | 0) % 2;
    if (e.k === 'dog') {
      if (e.swipe > 0 && !e.fall) {                        // reared up, forepaws going up and down
        const rear = (J ? TIGER_REAR : DOG_REAR)[((S.t * 9) | 0) % 2], rx = Math.round(x) + e.w - rear.w, ry = e.y + e.h - rear.h;
        blit(rear, rx, ry);
        text(J ? 'GRRR!' : 'WOOF!', rx - 3, ry - 9, J ? '#ff9a4a' : '#ffd76a');
      }
      else blit((J ? TIGER : DOG)[e.run ? fr : 0], x, e.y);
      if (!e.run && ((S.t * 3) | 0) % 2) text('!', Math.round(x) + 2, e.y - 8, '#ffd76a');
    } else if (J) {
      const rx = Math.round(x);
      if (e.up > 0) {                                      // rusty arm stretched along the ground
        const len = Math.round(e.reach * e.up), ay = e.y + 9;
        rect(rx - len, ay, len + 2, 3, '#8a5a3a'); rect(rx - len, ay, len + 2, 1, '#b07a4a');
        for (let j = 4; j < len; j += 7) {
          rect(rx - j, ay, 1, 3, '#5e3d28');
          if (((j / 7) | 0) % 3 === 0) rect(rx - j - 2, ay + 3, 3, 1 + ((j >> 1) % 3), '#4aa83c');
        }
        rect(rx - len - 4, ay - 2, 5, 2, '#5e3d28'); rect(rx - len - 4, ay + 3, 5, 2, '#5e3d28');   // open claw
        rect(rx - len - 1, ay, 2, 3, '#5e3d28');
        if (((S.t * 12) | 0) % 3 === 0) rect(rx - len - 6 + ((S.t * 31) | 0) % 4, ay - 3 + ((S.t * 17) | 0) % 7, 1, 1, '#ffe66a');
        if (e.up < 1) text('!', rx + 5, e.y - 8, '#ff4b4b');
      }
      blit(MOSSBOT[e.up > 0 ? 0 : fr], x, e.y);
      {                                                    // the other eye, dangling from its socket on a wire
        const sw = Math.round(Math.sin(S.t * 6 + e.home) * 1.6), ex = rx + sw;
        rect(rx + 3, e.y + 5, 1, 1, '#d8503a'); rect(rx + 2, e.y + 6, 1, 2, '#d8503a');
        rect(rx + 2 + (sw > 0 ? 1 : sw < 0 ? -1 : 0), e.y + 8, 1, 1, '#d8503a');
        rect(ex, e.y + 9, 4, 4, '#3a2a1c'); rect(ex + 1, e.y + 9, 2, 4, '#f4f0dc'); rect(ex, e.y + 10, 4, 2, '#f4f0dc');
        rect(ex + 1, e.y + 11, 1, 1, ((S.t * 5 + e.home) | 0) % 4 ? '#e23d3d' : '#3a2a1c');
      }
      if (((S.t * 7 + e.home) | 0) % 5 === 0) rect(rx + 4, e.y + 4, 4, 1, '#3a2a1c');               // flickering visor
      if (((S.t * 9 + e.home) | 0) % 11 === 0) rect(rx + 3 + ((S.t * 23) | 0) % 8, e.y - 2, 1, 1, '#ffe66a');   // sparks
    } else {
      if (e.up > 0) {
        const rx = Math.round(x), topY = Math.round(e.y - e.up * ARM_REACH), sh = e.y + 9;
        for (const ax of [rx, rx + 12]) {
          rect(ax, topY + 3, 2, sh - topY - 3, '#a9bdd1');
          for (let j = sh - 4; j > topY + 3; j -= 5) rect(ax, j, 2, 1, '#46546b');
          rect(ax - 1, topY, 4, 3, '#46546b');             // claw
          rect(ax, topY - 1, 1, 1, '#ff4b4b'); rect(ax + 1, topY + 1, 1, 1, '#5ff2ff');
        }
        if (e.up < 1) text('!', rx + 5, topY - 8, '#ff4b4b');
      }
      blit(BOT[fr], x, e.y);
      if (((S.t * 4) | 0) % 2) rect(Math.round(x) + 6, e.y, 1, 1, '#ffd76a');
    }
  }

  // fart clouds + dust
  for (const q of S.parts) {
    const a = q.life / q.max;
    ctx.globalAlpha = a > 0.55 ? Math.max(0, 1 - (a - 0.55) / 0.45) : 1;
    if (q.g && !q.c) blob(q.x - cam, q.y, q.s + a * 7, GREENS[Math.min(3, (a * 4) | 0)]);
    else blob(q.x - cam, q.y, q.s + (q.g ? a * 3 : 0), q.c || '#a79fc2');
  }
  ctx.globalAlpha = 1;

  // ninja
  const nx = p.x - cam;
  const frame = S.mode === 'dead' ? 3 : (p.air > 0.03 && S.mode === 'play') ? 3 : RUN_CYCLE[(p.run | 0) % 4];
  blit(NINJA[frame], nx, p.y, S.mode === 'dead');
  if (S.mode !== 'dead') {                       // fluttering headband tail
    const fl = ((S.t * 12) | 0) % 2;
    rect(Math.round(nx) - 2, Math.round(p.y) + 3 + fl, 2, 1, '#e23d3d');
    rect(Math.round(nx) - 3, Math.round(p.y) + 4 - fl, 1, 1, '#e23d3d');
  }

  for (const o of S.pops) text(o.s, Math.round(o.x - cam), Math.round(o.y - o.t * 24), '#ffd76a');
  ctx.restore();

  // HUD
  const dist = distM(), score = scoreNow();
  text((J ? 'JUNGLE ' : 'DISTRICT ') + S.code, 6, 6, '#e6dcff');
  text('BEST ' + best, 6, 14, '#a99ad6');
  textC(String(score), 5, '#ffffff', 2);
  textC(dist + 'M', 19, '#cfc4f0');
  text('GAS', VW - 44, 6, '#e6dcff');
  for (let i = 0; i < 2; i++) {
    rect(VW - 28 + i * 10, 5, 8, 7, '#14132b');
    blob(VW - 24 + i * 10, 8.5, 5, i < p.gas ? '#a9ea4c' : '#3b3357');
  }
  blit(CAN, VW - 44, 15);
  text('X' + S.beanCount, VW - 33, 17, '#ffd76a');
  drawSound(); drawFS();
  if (S.mode === 'play' && S.banner.t > 0 && ((S.banner.t * 6) | 0) % 2) textC(S.banner.s, 40, '#dcff72', 3);

  if (S.mode === 'dead') {
    const y0 = LAY.deadY;
    textC('BUSTED!', y0, '#ff6b5e', 5);
    textC(S.why, y0 + 33, '#ffffff');
    textC('SCORE ' + score + ' - ' + dist + 'M - ' + S.beanCount + ' BEANS', y0 + 43, '#e6dcff');
    if (S.newBest) textC('NEW BEST!', y0 + 53, '#dcff72', 2);
    if (S.lock <= 0 && ((S.t * 2) | 0) % 2) textC(touch ? 'TAP TO RUN AGAIN' : 'PRESS SPACE OR TAP TO RUN AGAIN', y0 + (touch ? 68 : 70), '#ffd76a', touch ? 2 : 1);
    rect(MENU_BTN.x, MENU_BTN.y, MENU_BTN.w, MENU_BTN.h, '#14132b');
    rect(MENU_BTN.x + 1, MENU_BTN.y + 1, MENU_BTN.w - 2, MENU_BTN.h - 2, '#4b2f6c');
    textC(touch ? 'CHANGE LEVEL' : 'ESC - CHANGE LEVEL', MENU_BTN.y + 6, '#e6dcff', 1, null);
  }
}

/* ------------------------------------------------------------------- loop */
newLevel();
let last = 0, acc = 0;
function frame(ts) {
  const d = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts; acc += d;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  musicTick();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__fartNinja = { get S() { return S; }, update, draw, press, release, newLevel, STEP, speedAt, distM, scoreNow, view: () => [VW, VH, BELOW], setTouch: v => { touch = v; }, musicStep, jungleStep, menuStep, musicTick, setSel, startRun, toSplash, get mus() { return mus; }, get ac() { return ac; } };
})();
</script>
